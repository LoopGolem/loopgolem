name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LoopGolem.sln

      - name: Build
        run: dotnet build LoopGolem.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Worker self-test
        run: dotnet run --project src/LoopGolem.Worker/LoopGolem.Worker.csproj --configuration Release --no-build -- --self-test

      - name: Parse benchmark v3 PowerShell
        shell: pwsh
        run: |
          foreach ($script in @(
            'docs/benchmarks/benchmark-v3-runner.ps1',
            'docs/benchmarks/taskforge-v3-acceptance.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              Write-Error "PowerShell parse failed: $script"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
