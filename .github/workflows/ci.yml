name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LoopGolem.sln

      - name: Build
        run: dotnet build LoopGolem.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Worker self-test
        run: dotnet run --project src/LoopGolem.Worker/LoopGolem.Worker.csproj --configuration Release --no-build -- --self-test

      - name: Parse benchmark v3 PowerShell
        shell: pwsh
        run: |
          foreach ($script in @(
            'docs/benchmarks/benchmark-v3-start.ps1',
            'docs/benchmarks/benchmark-v3-runner.ps1',
            'docs/benchmarks/taskforge-v3-acceptance.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              Write-Error "PowerShell parse failed: $script"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }


      - name: Parse benchmark v3 Python
        run: python -m py_compile docs/benchmarks/probe-fork-model-no-turn.py

      - name: Windows PowerShell 5.1 benchmark compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in @(
            'docs/benchmarks/benchmark-v3-start.ps1',
            'docs/benchmarks/benchmark-v3-runner.ps1',
            'docs/benchmarks/taskforge-v3-acceptance.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -ne 0) {
              Write-Error "Windows PowerShell parse failed: $script"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

          $goalPath = Join-Path $PWD 'docs/benchmarks/taskforge-prompt-v1.txt'
          $goal = [IO.File]::ReadAllText($goalPath).Replace("`r`n", "`n").Replace("`r", "`n")
          $goalBytes = [Text.Encoding]::UTF8.GetBytes($goal)
          $hasher = [Security.Cryptography.SHA256]::Create()
          try {
            $hashBytes = $hasher.ComputeHash($goalBytes)
          }
          finally {
            $hasher.Dispose()
          }
          $hash = ([BitConverter]::ToString($hashBytes)).Replace("-", "").ToLowerInvariant()
          if ($hash -ne '1b1fd2bc6257cecf2a60fda1b579fb9f4f742d16dfdd299fa12070ab0b2e1d79') {
            throw "Canonical TaskForge prompt hash mismatch: $hash"
          }

          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $captured = @(& cmd.exe /d /c "echo expected-native-stderr 1>&2 & exit /b 7" 2>&1)
            $nativeExitCode = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }

          if ($nativeExitCode -ne 7) {
            throw "Expected native exit code 7, observed $nativeExitCode."
          }

          if (($captured | Out-String) -notmatch 'expected-native-stderr') {
            throw "Expected native stderr was not captured."
          }
